<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Phonics: Alphabet Dual Edition</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    /* --- 全局設置 --- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        margin: 0; overflow: hidden; background-color: #050510;
        font-family: 'Orbitron', sans-serif; color: #fff;
        height: 100vh; width: 100vw; user-select: none; touch-action: none;
    }

    #starfield {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        pointer-events: none;
    }

    /* --- 遊戲主舞台 (分區) --- */
    #game-stage {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10; display: flex;
    }

    .player-zone {
        position: relative; height: 100%; flex: 1;
        border-right: 2px dashed rgba(0, 210, 255, 0.3); overflow: hidden;
    }
    .player-zone:last-child { border-right: none; }

    /* 鎖定與懲罰狀態 */
    .zone-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center;
        z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        backdrop-filter: blur(3px); flex-direction: column;
    }
    .zone-overlay h2 {
        font-size: clamp(2rem, 5vw, 4rem); color: #fff; text-shadow: 0 0 20px #00d2ff;
        border: 4px solid #fff; padding: 10px 30px; background: rgba(0,0,0,0.5); transform: rotate(-5deg);
    }
    
    /* 震動動畫 */
    @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        20% { transform: translate(-5px, 0px) rotate(1deg); }
        40% { transform: translate(1px, -5px) rotate(-1deg); }
        60% { transform: translate(-5px, 1px) rotate(0deg); }
        80% { transform: translate(3px, -1px) rotate(1deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .shake-active { animation: shake 0.4s; box-shadow: inset 0 0 50px rgba(255,0,85,0.5); }

    /* --- HUD --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 100; pointer-events: none; display: flex; flex-direction: column; padding: 2vw;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .hud-side { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .info-box { text-align: center; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 15px; border: 1px solid #00d2ff; }
    .label { font-size: clamp(10px, 1.5vw, 14px); color: #00d2ff; letter-spacing: 2px; }
    .value { font-size: clamp(20px, 3vw, 30px); font-weight: bold; }
    .hearts { color: #ff0055; font-size: clamp(16px, 2.5vw, 24px); margin-top: 5px; }

    #time-box { text-align: center; flex: 1; }
    #time-val { font-size: clamp(30px, 5vw, 50px); color: #ffeb3b; text-shadow: 0 0 15px #ffeb3b; font-weight: bold; }

    .mission-area {
        position: absolute; top: 12vh; width: 100%; left: 0;
        display: flex; flex-direction: column; align-items: center; pointer-events: auto;
    }
    #target-display { 
        color: #fff; font-size: clamp(20px, 4vw, 30px); margin-bottom: 10px; 
        letter-spacing: 2px; text-shadow: 0 0 15px #00d2ff; animation: pulseText 1.5s infinite;
    }
    @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .replay-btn {
        background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff; color: #00d2ff;
        padding: 10px 30px; font-family: 'Orbitron'; font-size: clamp(16px, 3.5vw, 22px);
        cursor: pointer; border-radius: 30px; backdrop-filter: blur(5px); transition: 0.2s; text-transform: uppercase;
    }
    .replay-btn:active { background: #00d2ff; color: #000; transform: scale(0.95); }

    /* --- 敵人與外星人 --- */
    .enemy {
        position: absolute; width: clamp(70px, 10vw, 90px); height: clamp(70px, 10vw, 90px);
        display: flex; justify-content: center; align-items: center; cursor: pointer;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        background: rgba(30, 30, 50, 0.95); border: 2px solid rgba(255, 255, 255, 0.2); 
        box-shadow: inset 0 0 25px rgba(0, 210, 255, 0.4); z-index: 20; pointer-events: auto;
    }
    .enemy span { font-family: 'Comic Sans MS', cursive; font-size: clamp(20px, 3.5vw, 28px); font-weight: bold; color: #fff; pointer-events: none; }
    
    .alien {
        position: absolute; font-size: clamp(35px, 6vw, 50px); cursor: pointer; z-index: 19;
        filter: drop-shadow(0 0 15px #00ff00); pointer-events: auto; animation: wobble 2s infinite ease-in-out;
    }
    @keyframes wobble { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

    /* --- 雷射與砲塔 --- */
    .laser {
        position: absolute; height: 6px; background: #00ff9d; box-shadow: 0 0 10px #00ff9d, 0 0 20px #fff;
        transform-origin: 0 50%; pointer-events: none; z-index: 15; border-radius: 3px;
    }
    .player-base {
        position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
        width: clamp(70px, 10vw, 90px); height: clamp(70px, 10vw, 90px); 
        border-radius: 50%; z-index: 30; transition: filter 0.2s;
    }
    #base-1 { background: radial-gradient(circle, #00d2ff, #0056b3); box-shadow: 0 0 40px #00d2ff; }
    #base-2 { background: radial-gradient(circle, #ff00de, #7a006a); box-shadow: 0 0 40px #ff00de; }
    .player-base.dead { filter: grayscale(100%) brightness(50%); }

    .turret-container {
        position: absolute; bottom: clamp(30px, 6vw, 40px); left: 50%; transform: translateX(-50%);
        width: 12px; height: clamp(40px, 8vw, 60px); z-index: 29; pointer-events: none;
    }
    .player-turret { width: 100%; height: 100%; background: #fff; box-shadow: 0 0 15px #fff; border-radius: 5px; transform-origin: bottom center; transition: transform 0.1s ease-out; }

    .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 40; }
    .float-score { position: absolute; font-size: clamp(20px, 4vw, 28px); font-weight: bold; pointer-events: none; z-index: 50; animation: floatUp 1s forwards; text-shadow: 2px 2px 0 #000; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

    /* --- 面板 (大廳/結算) --- */
    .panel-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 5, 16, 0.95); backdrop-filter: blur(8px);
        display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; overflow-y: auto; padding: 20px;
    }
    .hidden { display: none !important; }
    
    h1 { font-size: clamp(2.5rem, 6vw, 4rem); margin: 0; background: linear-gradient(to right, #00d2ff, #ff00de); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(0, 210, 255, 0.3); text-align: center; }
    h2 { color: #00d2ff; letter-spacing: 2px; margin-bottom: 10px; font-size: clamp(1rem, 2.5vw, 1.3rem); text-align: center; border-bottom: 1px solid rgba(0,210,255,0.3); padding-bottom: 5px;}

    .lobby-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.6); padding: 20px; border-radius: 20px; border: 1px solid #00d2ff; }
    
    .letter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; width: 100%; margin-bottom: 20px; max-height: 35vh; overflow-y: auto; padding-right: 10px;}
    
    .letter-btn, .setting-btn {
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #ccc;
        font-family: 'Orbitron'; font-size: clamp(14px, 3vw, 18px); padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .letter-btn { font-family: 'Comic Sans MS', sans-serif; font-weight: bold; }
    .letter-btn.selected, .setting-btn.selected { background: rgba(0, 210, 255, 0.2); border-color: #00d2ff; color: #fff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
    
    .btn-neon {
        margin-top: 15px; padding: 12px 30px; font-size: clamp(18px, 3.5vw, 24px); font-family: 'Orbitron'; font-weight: bold;
        color: #00d2ff; background: transparent; border: 2px solid #00d2ff; box-shadow: 0 0 15px #00d2ff;
        cursor: pointer; border-radius: 10px; transition: 0.2s;
    }
    .btn-neon:hover { background: #00d2ff; color: #000; box-shadow: 0 0 30px #00d2ff; }

    /* --- 虛擬鍵盤 --- */
    .keyboard-container { width: 100%; max-width: 700px; margin-top: 10px; display: flex; flex-direction: column; align-items: center;}
    .input-row { display: flex; gap: 20px; width: 100%; justify-content: center; margin-bottom: 15px; }
    .name-display {
        background: rgba(0,0,0,0.8); border: 2px solid #555; color: #aaa;
        height: 50px; width: 250px; font-size: 20px; text-align: center; line-height: 46px; 
        border-radius: 8px; letter-spacing: 2px; cursor: pointer; transition: 0.2s;
    }
    .name-display.active { border-color: #00ff9d; color: #00ff9d; box-shadow: 0 0 15px rgba(0, 255, 157, 0.5); }
    
    .key-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }
    .vk-btn { background: rgba(255,255,255,0.1); border: 1px solid #aaa; color: #fff; padding: 12px 15px; border-radius: 5px; font-size: 18px; cursor: pointer; flex: 1; min-width: 35px; text-align: center;}
    .vk-btn:active { background: #fff; color: #000; }
    .action-btn { min-width: 80px; background: rgba(0, 210, 255, 0.2); border-color: #00d2ff; }

    .panel-overlay { justify-content: flex-start; padding-top: 65px; touch-action: pan-y; }
    .panel-overlay > * { flex-shrink: 0; }
    body { -webkit-touch-callout: none; }
    #fullscreen-btn { position: fixed; right: 10px; bottom: 12px; z-index: 400; background: #10182f; min-height: 44px; }
    .voice-settings { width: 100%; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; padding: 12px; border: 1px solid #36536c; border-radius: 10px; }
    .voice-settings label { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    select { background: #15233a; color: white; padding: 10px; border: 1px solid #00d2ff; border-radius: 6px; font-size: 16px; max-width: 100%; }
    input[type=range] { width: 160px; min-height: 44px; touch-action: pan-x; accent-color: #00d2ff; }
    .note { font: 14px/1.6 sans-serif; color: #bdccda; text-align: center; width: 100%; margin: 4px 0; }
    #leaderboard-list { overflow-wrap: anywhere; }
    .name-display { min-width: 0; }
</style>
</head>
<body>

<div id="starfield"></div>
<button id="fullscreen-btn" class="setting-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>

<!-- 遊戲舞台 -->
<div id="game-stage">
    <div class="player-zone" id="zone-1">
        <div class="zone-overlay" id="overlay-1"><h2 id="msg-1">WAITING...</h2></div>
        <div class="turret-container"><div class="player-turret" id="turret-1"></div></div>
        <div class="player-base" id="base-1"></div>
    </div>
    <div class="player-zone" id="zone-2">
        <div class="zone-overlay" id="overlay-2"><h2 id="msg-2">WAITING...</h2></div>
        <div class="turret-container"><div class="player-turret" id="turret-2"></div></div>
        <div class="player-base" id="base-2"></div>
    </div>
</div>

<!-- HUD -->
<div id="ui-layer" class="hidden">
    <div class="top-bar">
        <div class="hud-side" id="hud-1">
            <div class="info-box"><div class="label">P1 SCORE</div><div class="value" id="score-1">0</div></div>
            <div class="hearts" id="hp-1">❤️❤️❤️❤️❤️</div>
        </div>
        <div id="time-box"><div class="label">TIME</div><div id="time-val">60</div></div>
        <div class="hud-side" id="hud-2">
            <div class="info-box" style="border-color:#ff00de;"><div class="label" style="color:#ff00de;">P2 SCORE</div><div class="value" id="score-2">0</div></div>
            <div class="hearts" id="hp-2">❤️❤️❤️❤️❤️</div>
        </div>
    </div>
    <div class="mission-area">
        <div id="target-display">🔊 LISTEN...</div>
        <button class="replay-btn" onclick="speakCurrentTarget()">▶ REPLAY AUDIO</button>
    </div>
</div>

<!-- 大廳 -->
<div id="lobby-screen" class="panel-overlay">
    <h1>NEON<br>ALPHABET</h1>
    <p style="color: #ccc; margin-bottom: 20px;">Listen to the word & Shoot the correct letter!</p>
    
    <div class="lobby-container">
        <div style="display:flex; gap: 20px; width: 100%; justify-content: center; margin-bottom:15px; flex-wrap:wrap;">
            <div style="text-align:center;">
                <h3 style="margin:5px 0; font-size:1.2rem;">Mode</h3>
                <button class="setting-btn mode-btn selected" onclick="setMode(this, 1)">1 Player</button>
                <button class="setting-btn mode-btn" onclick="setMode(this, 2)">2 Players</button>
            </div>
            <div style="text-align:center;">
                <h3 style="margin:5px 0; font-size:1.2rem;">Time</h3>
                <button class="setting-btn time-btn" onclick="setTime(this, 30)">30s</button>
                <button class="setting-btn time-btn" onclick="setTime(this, 45)">45s</button>
                <button class="setting-btn time-btn selected" onclick="setTime(this, 60)">60s</button>
                <button class="setting-btn time-btn" onclick="setTime(this, 90)">90s</button>
                <button class="setting-btn time-btn" onclick="setTime(this, 120)">120s</button>
            </div>
        </div>

        <div class="voice-settings">
            <label for="speech-rate">語速 Speed <output id="rate-value">0.8×</output>
                <input id="speech-rate" type="range" min="0.5" max="1.0" step="0.1" value="0.8" oninput="changeSpeechSettings()">
            </label>
            <label for="speech-accent">英文口音 Accent
                <select id="speech-accent" onchange="changeSpeechSettings()">
                    <option value="en-US">美國 US</option><option value="en-GB">英國 UK</option>
                    <option value="en-AU">澳洲 AU</option><option value="en-NZ">紐西蘭 NZ</option>
                    <option value="en-CA">加拿大 CA</option><option value="en-IE">愛爾蘭 IE</option>
                </select>
            </label>
            <button class="setting-btn" id="voice-preview" onclick="previewVoice()">▶ 試聽</button>
            <p class="note" id="voice-status" role="status"></p>
        </div>
        <h2 style="width:100%;">Select Letters <button style="float:right; background:none; border:1px solid #00d2ff; color:#00d2ff; padding:2px 10px; border-radius:5px; cursor:pointer;" onclick="toggleAll()">All / None</button></h2>
        
        <div class="letter-grid" id="lobby-letters">
            <!-- Letters will be generated here -->
        </div>
        
        <button class="btn-neon" onclick="startGame()">START MISSION</button>
        <button class="setting-btn" style="margin-top:16px" onclick="openLeaderboard()">🏆 查看排行榜</button>
        <p class="note">排行榜自動保存在此瀏覽器，重新整理不會清除。僅按「清除排行榜」後刪除。顯示最高 7 筆成績。</p>
        <p class="note storage-status" role="status"></p>
    </div>
</div>

<!-- 結算輸入 -->
<div id="game-over-screen" class="panel-overlay hidden">
    <h1 style="color: #ffeb3b; -webkit-text-fill-color: #ffeb3b;">GAME OVER</h1>
    
    <div class="keyboard-container">
        <h3 style="margin:5px 0;">Enter Your Name:</h3>
        <div class="input-row">
            <div class="name-display active" id="input-disp-1" onclick="focusInput(1)">P1: _</div>
            <div class="name-display" id="input-disp-2" onclick="focusInput(2)" style="display:none;">P2: _</div>
        </div>
        <div id="virtual-keyboard"></div>
    </div>
</div>

<!-- 排行榜 -->
<div id="leaderboard-screen" class="panel-overlay hidden">
    <h1>LEADERBOARD</h1>
    <p class="note storage-status" role="status"></p>
    <button class="setting-btn" onclick="clearLeaderboard()">清除排行榜 / Clear</button>
    <div id="leaderboard-list" style="width: 100%; max-width: 500px; margin: 20px 0; font-size: 20px;"></div>
    
    <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
        <button id="play-again-btn" class="btn-neon" onclick="playAgain()">PLAY AGAIN</button>
        <button class="btn-neon" style="border-color:#ff00de; color:#ff00de; box-shadow: 0 0 15px #ff00de;" onclick="showScreen('lobby-screen')">LOBBY</button>
    </div>
</div>

<script>
    // --- 1. A-Z 遊戲單字庫 ---
    const masterData = [
        { letter: 'A', text: 'A a', word: 'ant' }, { letter: 'A', text: 'A a', word: 'apple' },
        { letter: 'B', text: 'B b', word: 'bag' }, { letter: 'B', text: 'B b', word: 'boy' },
        { letter: 'C', text: 'C c', word: 'cat' }, { letter: 'C', text: 'C c', word: 'cup' },
        { letter: 'D', text: 'D d', word: 'dog' }, { letter: 'D', text: 'D d', word: 'duck' },
        { letter: 'E', text: 'E e', word: 'egg' }, { letter: 'E', text: 'E e', word: 'elephant' },
        { letter: 'F', text: 'F f', word: 'fish' }, { letter: 'F', text: 'F f', word: 'fan' },
        { letter: 'G', text: 'G g', word: 'goat' }, { letter: 'G', text: 'G g', word: 'girl' },
        { letter: 'H', text: 'H h', word: 'hand' }, { letter: 'H', text: 'H h', word: 'hat' },
        { letter: 'I', text: 'I i', word: 'ink' }, { letter: 'I', text: 'I i', word: 'insect' },
        { letter: 'J', text: 'J j', word: 'jet' }, { letter: 'J', text: 'J j', word: 'jam' },
        { letter: 'K', text: 'K k', word: 'key' }, { letter: 'K', text: 'K k', word: 'kite' },
        { letter: 'L', text: 'L l', word: 'lion' }, { letter: 'L', text: 'L l', word: 'leg' },
        { letter: 'M', text: 'M m', word: 'monkey'}, { letter: 'M', text: 'M m', word: 'milk' },
        { letter: 'N', text: 'N n', word: 'nose' }, { letter: 'N', text: 'N n', word: 'neck' },
        { letter: 'O', text: 'O o', word: 'ox' }, { letter: 'O', text: 'O o', word: 'otter' },
        { letter: 'P', text: 'P p', word: 'pig' }, { letter: 'P', text: 'P p', word: 'pink' },
        { letter: 'Q', text: 'Q q', word: 'queen' }, { letter: 'Q', text: 'Q q', word: 'quiz' },
        { letter: 'R', text: 'R r', word: 'red' }, { letter: 'R', text: 'R r', word: 'rabbit' },
        { letter: 'S', text: 'S s', word: 'snake' }, { letter: 'S', text: 'S s', word: 'sun' },
        { letter: 'T', text: 'T t', word: 'turtle'}, { letter: 'T', text: 'T t', word: 'tiger' },
        { letter: 'U', text: 'U u', word: 'up' }, { letter: 'U', text: 'U u', word: 'umbrella' },
        { letter: 'V', text: 'V v', word: 'van' }, { letter: 'V', text: 'V v', word: 'vest' },
        { letter: 'W', text: 'W w', word: 'watch' }, { letter: 'W', text: 'W w', word: 'window' },
        { letter: 'X', text: 'X x', word: 'fox' }, { letter: 'X', text: 'X x', word: 'box' },
        { letter: 'Y', text: 'Y y', word: 'yo-yo' }, { letter: 'Y', text: 'Y y', word: 'yogurt' },
        { letter: 'Z', text: 'Z z', word: 'zoo' }, { letter: 'Z', text: 'Z z', word: 'zebra' }
    ];

    // --- 2. 遊戲狀態 ---
    let state = {
        mode: 1, timeTotal: 60, timeLeft: 60, isPlaying: false, activePool: [],
        currentWord: null, lastWord: null, currentDistractor: null, firstToAnswer: 0
    };

    let players = {
        1: { active: false, score: 0, hp: 5, status: 'playing', name: "", alienHits: 0, aliensEnabled: true, lastDrop: 0 },
        2: { active: false, score: 0, hp: 5, status: 'playing', name: "", alienHits: 0, aliensEnabled: true, lastDrop: 0 }
    };

    let enemies = []; 
    let timerId, gameLoopId;
    let focusedInput = 1;

    // --- 音效與語音 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if (type === 'laser') { osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now+0.1); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now+0.1); osc.start(now); osc.stop(now+0.1); }
        else if (type === 'hit') { osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.exponentialRampToValueAtTime(2000, now+0.1); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now+0.1); osc.start(now); osc.stop(now+0.1); }
        else if (type === 'bonus') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.linearRampToValueAtTime(1200, now+0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now+0.2); osc.start(now); osc.stop(now+0.2); }
        else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(80, now+0.3); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now+0.3); osc.start(now); osc.stop(now+0.3); }
    }

    const speech = window.speechSynthesis;
    const speechOptions = { rate: 0.8, lang: 'en-US' };
    let speechGeneration = 0;
    let speechTimer;
    function stopSpeech() {
        speechGeneration++;
        clearTimeout(speechTimer);
        if (speech) speech.cancel();
    }
    function chosenVoice() {
        if (!speech) return null;
        const voices = speech.getVoices();
        const lang = v => v.lang.replace(/_/g, '-').toLowerCase();
        return voices.find(v => lang(v) === speechOptions.lang.toLowerCase()) ||
            voices.find(v => /^en(-|$)/.test(lang(v))) || null;
    }
    function refreshVoiceStatus() {
        const status = document.getElementById('voice-status');
        document.getElementById('voice-preview').disabled = !speech;
        if (!speech) { status.textContent = '此瀏覽器不支援語音，請使用支援語音的瀏覽器。'; return; }
        const voice = chosenVoice();
        const exact = voice && voice.lang.replace(/_/g, '-').toLowerCase() === speechOptions.lang.toLowerCase();
        status.textContent = exact ? '目前語音：' + voice.name + ' (' + voice.lang + ')' :
            voice ? '此裝置沒有所選口音；暫用 ' + voice.name + ' (' + voice.lang + ')。可安裝對應英文語音後重新開啟。' :
            '尚未取得英文語音清單，將請系統使用所選口音；實際口音依装置可用語音而定，請先試聽。';
    }
    function changeSpeechSettings() {
        stopSpeech();
        speechOptions.rate = Number(document.getElementById('speech-rate').value);
        speechOptions.lang = document.getElementById('speech-accent').value;
        document.getElementById('rate-value').textContent = speechOptions.rate.toFixed(1) + '×';
        refreshVoiceStatus();
    }
    function makeUtterance(text) {
        const u = new SpeechSynthesisUtterance(text);
        const voice = chosenVoice();
        u.lang = voice ? voice.lang : speechOptions.lang;
        if (voice) u.voice = voice;
        u.rate = speechOptions.rate;
        u.onerror = e => {
            if (e.error !== 'canceled' && e.error !== 'interrupted')
                document.getElementById('voice-status').textContent = '語音播放失敗，請確認裝置語音與網路，或改選另一種口音後試聽。';
        };
        return u;
    }
    function previewVoice() {
        if (!speech) return;
        stopSpeech(); refreshVoiceStatus();
        speech.speak(makeUtterance('Apple. Dog. Zebra.'));
    }
    // 每題播放三次；取消舊的重播排程，避免換題／快速重播時重疊。
    function speakCurrentTarget() {
        stopSpeech();
        if (!speech || !state.currentWord || !state.isPlaying) return;
        const generation = speechGeneration;
        const word = state.currentWord.word;
        let remaining = 3;
        function play() {
            if (generation !== speechGeneration || !state.isPlaying || state.currentWord.word !== word) return;
            const u = makeUtterance(word);
            u.onend = () => {
                if (generation === speechGeneration && --remaining > 0) speechTimer = setTimeout(play, 800);
            };
            speech.speak(u);
        }
        play();
    }
    if (speech) speech.addEventListener('voiceschanged', refreshVoiceStatus);

    async function toggleFullscreen() {
        try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) await exit.call(document);
            } else {
                const root = document.documentElement;
                const enter = root.requestFullscreen || root.webkitRequestFullscreen;
                if (!enter) { alert('此瀏覽器不支援網頁全螢幕，請使用瀏覽器的全螢幕功能。'); return; }
                await enter.call(root);
            }
            updateFullscreenButton();
        } catch (e) { alert('無法進入全螢幕，請在獨立瀏覽器視窗開啟此 HTML 後再試。'); }

    // --- 遊戲邏輯 ---
    function playAgain() { startGame(true); }

    function startGame(isReplay = false) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        if(!isReplay) {
            const sel = Array.from(document.querySelectorAll('.letter-btn.selected')).map(b => b.dataset.v);
            if(sel.length < 2) { alert("Please select at least 2 letters!"); return; }
            state.activePool = masterData.filter(d => sel.includes(d.letter));
            if(state.activePool.length === 0) return;
        }

        scoresSubmitted = false;
        stopSpeech();
        showScreen('ui-layer');
        document.getElementById('zone-2').style.display = state.mode === 2 ? 'block' : 'none';
        document.getElementById('hud-2').style.display = state.mode === 2 ? 'flex' : 'none';

        players[1] = { active: true, score: 0, hp: 5, status: 'playing', name: "", alienHits: 0, aliensEnabled: true, lastDrop: 0 };
        players[2] = { active: state.mode===2, score: 0, hp: 5, status: 'playing', name: "", alienHits: 0, aliensEnabled: true, lastDrop: 0 };
        
        focusInput(1); updateNameDisp();
        document.querySelectorAll('.player-base').forEach(b => b.classList.remove('dead'));
        document.querySelectorAll('.zone-overlay').forEach(o => o.style.opacity = 0);
        enemies.forEach(e => e.el.remove()); enemies = [];
        state.lastWord = null;

        state.timeLeft = state.timeTotal; state.isPlaying = true;
        updateHUD();
        
        if(timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            if(!state.isPlaying) return;
            state.timeLeft--; updateHUD();
            if(state.timeLeft <= 0) gameOver();
        }, 1000);

        pickNewTarget();
        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function getDistractor(correctItem) {
        let pool = state.activePool.filter(d => d.letter !== correctItem.letter);
        
        // 防呆: 避免 X x 出現 F, B 選項
        if (correctItem.letter === 'X') {
            pool = pool.filter(d => d.letter !== 'F' && d.letter !== 'B');
        }

        if(pool.length === 0) {
            pool = masterData.filter(d => d.letter !== correctItem.letter);
        }
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function pickNewTarget() {
        if(!state.isPlaying) return;
        
        let pool = state.activePool;
        if(state.activePool.length > 1 && state.lastWord) {
            pool = state.activePool.filter(d => d.word !== state.lastWord.word);
        }
        state.currentWord = pool[Math.floor(Math.random() * pool.length)];
        state.lastWord = state.currentWord;
        
        state.currentDistractor = getDistractor(state.currentWord);
        state.firstToAnswer = 0;

        [1, 2].forEach(pId => {
            if(players[pId].active) {
                if(players[pId].status === 'waiting') {
                    players[pId].status = 'playing';
                    document.getElementById(`overlay-${pId}`).style.opacity = 0;
                }
                players[pId].alienHits = 0;
                players[pId].aliensEnabled = true;
                players[pId].lastDrop = 0; 
            }
        });

        const td = document.getElementById('target-display');
        td.style.animation = 'none'; void td.offsetWidth; td.style.animation = 'pulseText 1.5s infinite';
        speakCurrentTarget();
        
        enemies.forEach(e => e.el.remove()); enemies = [];
    }

    function dropWaveForPlayer(pId) {
        spawnItem(pId, state.currentWord.text, 'letter');
        spawnItem(pId, state.currentDistractor.text, 'letter');
        
        if(players[pId].aliensEnabled && Math.random() < 0.45) {
            spawnItem(pId, '👽', 'alien');
        }
    }

    function spawnItem(pId, val, type) {
        const zone = document.getElementById(`zone-${pId}`);
        const el = document.createElement('div');
        
        if(type === 'alien') {
            el.className = 'alien'; el.innerText = val;
        } else {
            el.className = 'enemy'; el.innerHTML = `<span>${val}</span>`;
            const hue = Math.floor(Math.random() * 360);
            el.style.borderColor = `hsl(${hue}, 100%, 70%)`; el.style.boxShadow = `inset 0 0 20px hsl(${hue}, 100%, 50%)`;
        }

        const width = zone.clientWidth;
        const x = Math.random() * (width - 100) + 10;
        const startY = -100 - (Math.random() * 150); 
        
        el.style.left = x + 'px'; el.style.top = startY + 'px';

        const shootHandler = (e) => {
            if (e.type === 'mousedown' && e.button !== 0) return;
            e.preventDefault(); e.stopPropagation();
            if(players[pId].status === 'playing') executeShot(pId, el, type, val, x, parseFloat(el.style.top));
        };
        el.addEventListener('mousedown', shootHandler); el.addEventListener('touchstart', shootHandler);

        zone.appendChild(el);
        enemies.push({ el: el, pId: pId, y: startY, speed: 1.5 + Math.random()*1.5, type: type, val: val });
    }

    function executeShot(pId, targetEl, type, val, targetX, targetY) {
        const zone = document.getElementById(`zone-${pId}`);
        const turretContainer = zone.querySelector('.turret-container');
        const turret = zone.querySelector('.player-turret');
        
        const startX = turretContainer.offsetLeft + turretContainer.offsetWidth/2;
        const startY = turretContainer.offsetTop;

        const dx = (targetX + 40) - startX; 
        const dy = (targetY + 40) - startY;
        const angle = Math.atan2(dy, dx);
        
        turret.style.transform = `rotate(${(angle * 180 / Math.PI) + 90}deg)`;

        const laser = document.createElement('div'); laser.className = 'laser';
        laser.style.width = Math.sqrt(dx*dx + dy*dy) + 'px';
        laser.style.left = startX + 'px'; laser.style.top = startY + 'px';
        laser.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
        zone.appendChild(laser);
        
        playSound('laser');
        setTimeout(() => { laser.remove(); handleHit(pId, targetEl, type, val, targetX+40, targetY+40); }, 80);
    }

    function removeAliensForPlayer(pId) {
        for(let i=enemies.length-1; i>=0; i--) {
            if(enemies[i].pId === pId && enemies[i].type === 'alien') {
                enemies[i].el.remove(); enemies.splice(i, 1);
            }
        }
    }

    function handleHit(pId, el, type, val, x, y) {
        const idx = enemies.findIndex(e => e.el === el);
        if(idx > -1) enemies.splice(idx, 1);
        if(el.parentNode) el.remove();

        const zone = document.getElementById(`zone-${pId}`);

        if(type === 'alien') {
            playSound('bonus'); players[pId].score += 20;
            players[pId].alienHits++;
            createParticles(zone, x, y, '#00ff00'); showFloatText(zone, x, y, '+20', '#00ff00');
            
            if(players[pId].alienHits >= 3) {
                players[pId].aliensEnabled = false;
                removeAliensForPlayer(pId);
            }
        } else {
            if(val === state.currentWord.text) {
                playSound('hit'); 
                let addScore = 100;
                
                if(state.mode === 2 && state.firstToAnswer === 0) {
                    state.firstToAnswer = pId; addScore = 120;
                    showFloatText(zone, x, y-30, 'FIRST BONUS!', '#ffeb3b');
                }
                players[pId].score += addScore;
                createParticles(zone, x, y, '#00d2ff'); showFloatText(zone, x, y, `+${addScore}`, '#00d2ff');
                
                players[pId].status = 'waiting';
                document.getElementById(`msg-${pId}`).innerText = "WAITING...";
                document.getElementById(`overlay-${pId}`).style.opacity = 1;
                
                for(let i=enemies.length-1; i>=0; i--) {
                    if(enemies[i].pId === pId && enemies[i].type === 'letter') { enemies[i].el.remove(); enemies.splice(i, 1); }
                }

                let otherId = pId === 1 ? 2 : 1;
                if(players[otherId].active && players[otherId].status === 'playing') {
                    players[otherId].aliensEnabled = false;
                    removeAliensForPlayer(otherId);
                }

                checkRoundAdvance();

            } else {
                playSound('wrong');
                players[pId].hp -= 1;
                createParticles(zone, x, y, '#ff0055');
                
                zone.classList.remove('shake-active'); void zone.offsetWidth; zone.classList.add('shake-active');

                if(players[pId].hp <= 0) {
                    players[pId].status = 'dead';
                    document.getElementById(`base-${pId}`).classList.add('dead');
                    document.getElementById(`msg-${pId}`).innerText = "OUT OF HEARTS";
                    document.getElementById(`overlay-${pId}`).style.opacity = 1;
                    
                    for(let i=enemies.length-1; i>=0; i--) {
                        if(enemies[i].pId === pId) { enemies[i].el.remove(); enemies.splice(i, 1); }
                    }
                    
                    // 全死提早結束判定
                    let allDead = true;
                    [1, 2].forEach(id => {
                        if(players[id].active && players[id].status !== 'dead') allDead = false;
                    });
                    if(allDead) { gameOver(); return; }

                    checkRoundAdvance();
                }
            }
        }
        updateHUD();
    }

    function checkRoundAdvance() {
        let readyToAdvance = true; let allDead = true;
        [1, 2].forEach(pId => {
            if(players[pId].active) {
                if(players[pId].status === 'playing') readyToAdvance = false;
                if(players[pId].status !== 'dead') allDead = false;
            }
        });
        if(readyToAdvance && !allDead) setTimeout(pickNewTarget, 800);
    }

    function createParticles(zone, x, y, color) {
        for(let i=0; i<15; i++) {

            p.style.left = x+'px'; p.style.top = y+'px'; zone.appendChild(p);

            p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a)*v}px, ${Math.sin(a)*v}px) scale(0)`, opacity: 0 }], { duration: 600 }).onfinish = ()=>p.remove();
        }

    function showFloatText(zone, x, y, text, color) {

    function updateHUD() {
        document.getElementById('time-val').innerText = state.timeLeft;
        document.getElementById('score-1').innerText = players[1].score;
        document.getElementById('hp-1').innerText = '❤️'.repeat(Math.max(0, players[1].hp));

    function gameLoop(timestamp) {
        if(!state.isPlaying) return;
        const stageH = window.innerHeight;

        [1, 2].forEach(pId => {
            if(players[pId].active && players[pId].status === 'playing') {
                let activeDrops = enemies.filter(e => e.pId === pId && e.type === 'letter').length;
                if(timestamp - players[pId].lastDrop > 1500 && activeDrops < 8) {
                    dropWaveForPlayer(pId);
                    players[pId].lastDrop = timestamp;
                }
            }
        });

        enemies.forEach((e, i) => {
            e.y += e.speed; e.el.style.top = e.y + 'px';
            if(e.y > stageH) { e.el.remove(); enemies.splice(i, 1); }
        });

        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        state.isPlaying = false; stopSpeech();
        clearInterval(timerId); cancelAnimationFrame(gameLoopId);
        showScreen('game-over-screen');
        
        if(state.mode === 2) {
            document.getElementById('input-disp-2').style.display = 'block';

            document.getElementById('input-disp-2').style.display = 'none';
        }

    const leaderboardKey = 'neonAlphaLB';
    let memoryLeaderboard = [];
    let scoresSubmitted = false;
    function storageMessage(message) {
        document.querySelectorAll('.storage-status').forEach(el => el.textContent = message);
    }
    function readLeaderboard() {
        try {
            const data = JSON.parse(localStorage.getItem(leaderboardKey) || '[]');
            if (!Array.isArray(data)) throw new Error('Invalid leaderboard');
            memoryLeaderboard = data.filter(r => r && typeof r.name === 'string' && Number.isFinite(r.score));
            storageMessage('成績保存在此瀏覽器；請使用同一檔案與瀏覽器開啟。');
        } catch (e) { storageMessage('無法讀取本機紀錄，目前僅保留本次開啟的成績。'); }
        return [...memoryLeaderboard];
    }
    function writeLeaderboard(lb) {
        memoryLeaderboard = lb;
        try {
            localStorage.setItem(leaderboardKey, JSON.stringify(lb));
            storageMessage('已儲存在此瀏覽器，重新整理仍會保留。');
        } catch (e) { storageMessage('瀏覽器無法儲存：目前成績僅保留至此頁關閉，請確認瀏覽器儲存設定。'); }
    }
    function renderLeaderboard(lb) {
        const list = document.getElementById('leaderboard-list'); list.replaceChildren();
        if (!lb.length) { list.textContent = '尚無成績 / No scores yet'; return; }
        lb.sort((a,b) => b.score - a.score).slice(0,7).forEach((r,i) => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;justify-content:space-between;gap:20px;padding:10px;border-bottom:1px dashed #555;';
            const name = document.createElement('span'); name.textContent = (i+1) + '. ' + r.name;
            const score = document.createElement('span'); score.textContent = r.score; score.style.color = '#00ff9d';
            row.append(name, score); list.appendChild(row);
        });
    }
    function openLeaderboard(lb) {
        stopSpeech();
        renderLeaderboard(lb || readLeaderboard());
        document.getElementById('play-again-btn').classList.toggle('hidden', !scoresSubmitted);
        showScreen('leaderboard-screen');
    }
    function clearLeaderboard() {
        if (!confirm('確定清除全部排行榜紀錄？此操作無法復原。')) return;
        try {
            localStorage.removeItem(leaderboardKey);
            memoryLeaderboard = [];
            storageMessage('排行榜已清除。之後的新成績會繼續自動儲存。');
            renderLeaderboard([]);
        } catch (e) { storageMessage('無法清除本機紀錄，請確認瀏覽器儲存權限後再試。'); }
    }
    function submitScores() {
        if (scoresSubmitted || state.isPlaying) return;
        let lb = readLeaderboard();
        lb.push({ name: players[1].name.trim() || 'P1', score: players[1].score });
        if (state.mode === 2) lb.push({ name: players[2].name.trim() || 'P2', score: players[2].score });
        lb.sort((a,b) => b.score - a.score); lb = lb.slice(0,7);
        writeLeaderboard(lb);
        scoresSubmitted = true;
        openLeaderboard(lb);
    }

    function initStars() {
        const bg = document.getElementById('starfield');
        for(let i=0; i<60; i++) {
            const s = document.createElement('div'); s.style.position = 'absolute'; s.style.width = Math.random()*3+'px'; s.style.height=s.style.width; s.style.background='white'; s.style.borderRadius='50%'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.opacity=Math.random(); bg.appendChild(s);
